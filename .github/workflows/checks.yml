name: Source and package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check source and command-line configuration
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Check the installed wheel without model dependencies
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I -m plw --help
          python -I -m plw stage1 train --model bagel --dry-run
          python -I -m plw stage1 train --model omnigen2 --dry-run
          python -I -m plw stage2 train --model bagel --dry-run
          python -I -m plw stage2 train --model omnigen2 --dry-run
