name: Source and package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.29"
      - name: Check the dependency lockfile
        run: uv lock --check
      - name: Check source and command-line configuration
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: uv build
      - name: Check the installed wheel without model dependencies
        run: |
          uv pip install --system --no-deps dist/*.whl
          python -I -m plw --help
          python -I -m plw stage1 train --model bagel --dry-run
          python -I -m plw stage1 train --model omnigen2 --dry-run
          python -I -m plw stage2 train --model bagel --dry-run
          python -I -m plw stage2 train --model omnigen2 --dry-run
